    <script>
      try {
        var d = document.documentElement, t = localStorage.getItem('pa-theme'), i = localStorage.getItem('pa-icons');
        d.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'classic');
        d.dataset.icons = i || 'duo';
      } catch (e) { document.documentElement.dataset.theme = 'classic'; document.documentElement.dataset.icons = 'duo'; }
    </script>
